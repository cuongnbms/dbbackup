services:
  dbbackup:
    build:
      context: .
      dockerfile: Dockerfile
    image: cuongnb14/db-backup:1.6
    container_name: dbbackup
    restart: unless-stopped
    # Copy .env.example to .env and fill in real values. Never commit .env.
    env_file:
      - .env
    volumes:
      - ./backup_data:/backup
      - ./config.yaml:/app/config.yaml:ro
